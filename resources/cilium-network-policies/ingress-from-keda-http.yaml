apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-from-keda-http
spec:
  description: >
    Allow ingress traffic from keda http to selected pods.
  endpointSelector:
    matchLabels:
      netpol.cilium.io/ingress-from-keda-http: "true"
  
  ingress:
    - fromEndpoints:
      - matchLabels:
          app.kubernetes.io/instance: http-add-on
          app.kubernetes.io/component: interceptor
          k8s:io.kubernetes.pod.namespace: keda