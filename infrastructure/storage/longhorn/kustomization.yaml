apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn

resources:
  - namespace.yaml
  - s3-remote-backup-external-secret.yaml
  - backup-settings.yaml
  - recurring-backup-jobs.yaml
  - recurring-snapshot-jobs.yaml
  
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn
    valuesFile: values.yaml
    includeCRDs: true

# Patch DaemonSet longhorn-manager to add annotation of cilium netpols
# Allow egress to Longhorn namespace for monitoring Longhorn components.
patches:
  - target:
      kind: DaemonSet
      name: longhorn-manager
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/netpol.cilium.io~1ingress-from-prometheus
        value: "true"