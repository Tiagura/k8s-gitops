apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ci-arc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - git:
        repoURL: https://github.com/Tiagura/k8s-gitops.git
        revision: main
        directories:
          - path: infrastructure/controllers/arc/controller
          - path: infrastructure/controllers/arc/runners
  template:
    metadata:
      name: 'arc-{{path.basename}}'
      labels:
        app.kubernetes.io/part-of: infrastructure
        app.kubernetes.io/managed-by: argocd
    spec:
      project: infrastructure
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/Tiagura/k8s-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'arc-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 1m
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.dataFrom[].extract.conversionStrategy'
            - '.spec.dataFrom[].extract.decodingStrategy'
            - '.spec.dataFrom[].extract.metadataPolicy'
            - '.spec.dataFrom[].extract.nullBytePolicy'
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
      info:
        - name: Description
          value: 'Infrastructure component: arc-{{path.basename}} (CI)'