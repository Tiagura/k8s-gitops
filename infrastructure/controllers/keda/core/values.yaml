# In this chart the components resources are set by default
clusterName: kubernetes
clusterDomain: cluster.local

crds:
  install: true

# The chart network policies are to wide for my liking
# Disabled and use my own cilium network policies
networkPolicy:
  enabled: false
  flavor: cilium

podLabels:
  keda:
      netpol.cilium.io/egress-to-intra: "true"
      netpol.cilium.io/egress-to-kube-apiserver: "true"
      netpol.cilium.io/ingress-from-intra: "true"
      netpol.cilium.io/ingress-from-host: "true"
      netpol.cilium.io/ingress-from-prometheus: "true"
  metricsAdapter:
      netpol.cilium.io/egress-to-intra: "true"
      netpol.cilium.io/egress-to-kube-dns: "true"
      netpol.cilium.io/ingress-from-host: "true"
      netpol.cilium.io/ingress-from-prometheus: "true"
      netpol.cilium.io/ingress-from-remote-node: "true"
  webhooks:
      netpol.cilium.io/egress-to-intra: "true"
      netpol.cilium.io/egress-to-kube-dns: "true"
      netpol.cilium.io/ingress-from-host: "true"
      netpol.cilium.io/ingress-from-prometheus: "true"

priorityClassName: platform-critical

prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
  webhooks: 
    enabled: true
    serviceMonitor:
      enabled: true

certificates:
  autoGenerated: false
  certManager:
    enabled: true
    generateCA: true

customManagedBy: "ArgoCD"