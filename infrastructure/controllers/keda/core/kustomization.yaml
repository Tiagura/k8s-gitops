apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    version: 2.21.1
    namespace: keda
    releaseName: core
    includeCRDs: true
    valuesFile: values.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-admission-webhooks
    patch: |-
      - op: add
        path: /metadata/annotations/reloader.stakater.com~1auto
        value: "true"

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-operator
    patch: |-
      - op: add
        path: /metadata/annotations/reloader.stakater.com~1auto
        value: "true"

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-operator-metrics-apiserver
    patch: |-
      - op: add
        path: /metadata/annotations/reloader.stakater.com~1auto
        value: "true"