apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-http-interceptor
spec:
  description: >
    Allow keda-http-interceptor to egress to:
      monitoring:
        - hubble
      user-apps:
        management:
          - pgadmin
        misc:
          - excalidraw
          - fireflyiii-importer
        media:
          - stremio
        tools:
          - bentopdf
          - it-tools

  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: http-add-on
      app.kubernetes.io/component: interceptor

  egress:
    - toEndpoints:
      - matchLabels:
          app.kubernetes.io/name: hubble-ui
          app.kubernetes.io/part-of: cilium
          k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: pgadmin
          k8s:io.kubernetes.pod.namespace: pgadmin
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: excalidraw
          k8s:io.kubernetes.pod.namespace: excalidraw
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: fireflyiii
          tier: importer
          k8s:io.kubernetes.pod.namespace: fireflyiii
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: stremio
          k8s:io.kubernetes.pod.namespace: stremio
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: bentopdf
          k8s:io.kubernetes.pod.namespace: bentopdf
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    
    - toEndpoints:
      - matchLabels:
          app: it-tools
          k8s:io.kubernetes.pod.namespace: it-tools
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP