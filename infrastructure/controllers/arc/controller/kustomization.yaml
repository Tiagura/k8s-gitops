apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arc

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd

resources:
  - namespace.yaml

helmCharts:
  - name: gha-runner-scale-set-controller
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.14.2
    releaseName: arc
    namespace: arc
    valuesFile: values.yaml
    includeCRDs: true