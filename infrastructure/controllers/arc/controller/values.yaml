nameOverride: "arc-controller"
fullnameOverride: "arc-controller"

replicaCount: 1

serviceAccount:
  create: true
  name: "arc-controller-sa"

podLabels:
  netpol.cilium.io/egress-to-kube-apiserver: "true"
  netpol.cilium.io/egress-to-kube-dns: "true"
  netpol.cilium.io/egress-to-public-ips: "true"
  netpol.cilium.io/ingress-from-prometheus: "true"

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 32Mi

priorityClassName: "gitops-critical" 

# https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/deploy-runner-scale-sets#enabling-metrics
metrics:
  controllerManagerAddr: ":8080"
  listenerAddr: ":8080"
  listenerEndpoint: "/metrics"

flags:
  ## Log level can be set here with one of the following values: "debug", "info", "warn", "error".
  logLevel: "debug"
  ## Log format can be set with one of the following values: "text", "json"
  logFormat: "text"

  ## Restricts the controller to only watch resources in the desired namespace.
  ## Defaults to watch all namespaces when unset.
  watchSingleNamespace: "arc-runners"

  ## The maximum number of concurrent reconciles which can be run by the EphemeralRunner controller.
  # Increase this value to improve the throughput of the controller.
  # It may also increase the load on the API server and the external service (e.g. GitHub API).
  runnerMaxConcurrentReconciles: 2