apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-netpol
spec:
  description: >
    Allow cloudflared pods to:
      Ingress from:
        - homepage
      Egress to:
        - access to the externally exposed apps:
            misc:
              - excalidraw
              - karakeep
              - memos
            media:
              - nodecast-tv
              - stremio
            tools:
              - bentopdf
              - it-tools

  endpointSelector:
    matchLabels:
      app: cloudflared

  ingress:
    - fromEndpoints:
      - matchLabels:
          app: homepage
          k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
      - ports:
        - port: "2000"
          protocol: TCP

  egress:
    - toEndpoints:
      - matchLabels:
          app: excalidraw
          k8s:io.kubernetes.pod.namespace: excalidraw
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: karakeep
          tier: web
          k8s:io.kubernetes.pod.namespace: karakeep
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  
    - toEndpoints:
      - matchLabels:
          app: memos
          k8s:io.kubernetes.pod.namespace: memos
      toPorts:
        - ports:
            - port: "5230"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: nodecast-tv
          k8s:io.kubernetes.pod.namespace: nodecast-tv
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: stremio
          k8s:io.kubernetes.pod.namespace: stremio
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    - toEndpoints:
      - matchLabels:
          app: bentopdf
          k8s:io.kubernetes.pod.namespace: bentopdf
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    
    - toEndpoints:
      - matchLabels:
          app: it-tools
          k8s:io.kubernetes.pod.namespace: it-tools
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-to-sso
spec:
  description: >
    Allow Cloudflared egress traffic to Pocket ID
    for authentication and application access.

  endpointSelector:
    matchLabels:
      app: cloudflared

  egress:
    - toEndpoints:
        - matchLabels:
            app: pocket-id
            k8s:io.kubernetes.pod.namespace: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
          rules:
            http:
              # OIDC authorization and interaction
              - method: GET
                path: "^/authorize(\\?.*)?$"

              - method: GET
                path: "^/interaction(\\?.*)?$"

              - method: GET
                path: "^/api/oidc/interactions/.*$"

              - method: POST
                path: "^/api/oidc/interactions/[^/]+/complete$"

              # User information and application configuration
              - method: GET
                path: "^/api/users/me$"

              - method: GET
                path: "^/api/users/[^/]+/profile-picture\\.png$"

              - method: GET
                path: "^/api/application-configuration$"

              - method: GET
                path: "^/_app/version\\.json$"

              # WebAuthn login
              - method: GET
                path: "^/api/webauthn/login/start$"

              - method: POST
                path: "^/api/webauthn/login/finish$"

              # Application images
              - method: GET
                path: "^/api/application-images/(logo|favicon|background)(\\?.*)?$"

              - method: HEAD
                path: "^/api/application-images/(logo|favicon|background)(\\?.*)?$"

              # Static application assets
              - method: GET
                path: "^/_app/immutable/.*$"

              # Fonts and images
              - method: GET
                path: "^/fonts/.*$"

              - method: GET
                path: "^/img/.*$"