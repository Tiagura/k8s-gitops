apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: it-tools-interceptorroute
spec:
  target:
    service: it-tools
    port: 80
  rules:
    - hosts:
        - tools.tamhomelab.com
  scalingMetric:
    requestRate:
      targetValue: 1
      window: 1m
      granularity: 1s
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: text/html
          Refresh: "5"
        body: "<h1>Loading... / A carregar...</h1><p>The service is starting up. Please wait a moment and try again.</p>"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: it-tools-scaledobject
spec:
  scaleTargetRef:
    name: it-tools
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 120
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: it-tools-interceptorroute