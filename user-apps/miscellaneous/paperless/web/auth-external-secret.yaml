apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-external-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: auth-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"{{ .OAUTH_CLIENT_ID }}","secret":"{{ .OAUTH_CLIENT_SECRET }}","settings":{"server_url":"https://sso.tamhomelab.com"}}]}}
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: prod/sso/paperless
        property: OAUTH_CLIENT_ID
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod/sso/paperless
        property: OAUTH_CLIENT_SECRET
