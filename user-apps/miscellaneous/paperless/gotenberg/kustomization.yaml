apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
    
labels:
  - pairs:
      app.kubernetes.io/name: gotenberg
      app.kubernetes.io/component: document-converter
      app.kubernetes.io/part-of: paperless

helmCharts:
  - name: gotenberg
    repo: https://maikumori.github.io/helm-charts
    version: 1.30.0
    releaseName: "gotenberg"
    namespace: paperless
    valuesFile: values.yaml

resources:
  - service.yaml
  - keda.yaml

patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: gotenberg-test-connection
  - target:
      kind: Deployment
      name: gotenberg
    patch: |-
      # Add ArgoCD ignore differences annotation to the gotenberg deployment
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1ignore-differences
        value: |-
          jsonPointers:
          - /spec/replicas