apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: gotenberg-interceptorroute
spec:
  target:
    service: gotenberg
    port: 3000
  rules:
    - hosts:
        - "gotenberg-proxy.paperless.svc.cluster.local"
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gotenberg-scaledobject
spec:
  scaleTargetRef:
    name: gotenberg
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: gotenberg-interceptorroute