apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: tika
      app.kubernetes.io/component: metadata-extraction
      app.kubernetes.io/part-of: paperless

helmCharts:
  - name: tika
    repo: https://apache.jfrog.io/artifactory/tika
    version: 3.2.2
    releaseName: "tika"
    namespace: paperless
    valuesFile: values.yaml

resources:
  - service.yaml
  - keda.yaml

patches:
  - target:
      kind: Deployment
      name: tika
    patch: |-
      # Add ArgoCD ignore differences annotation to the tika deployment
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1ignore-differences
        value: |-
          jsonPointers:
          - /spec/replicas
      # Add Cilium network policy labels to the tika deployment pod template
      - op: add
        path: /spec/template/metadata/labels/netpol.cilium.io~1egress-to-intra
        value: "true"
      - op: add
        path: /spec/template/metadata/labels/netpol.cilium.io~1egress-to-kube-dns
        value: "true"
      - op: add
        path: /spec/template/metadata/labels/netpol.cilium.io~1ingress-from-keda-http
        value: "true"