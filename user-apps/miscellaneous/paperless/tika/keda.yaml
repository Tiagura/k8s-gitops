apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: tika-interceptorroute
spec:
  target:
    service: tika
    port: 9998
  rules:
    - hosts:
        - "tika-proxy.paperless.svc.cluster.local"
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tika-scaledobject
spec:
  scaleTargetRef:
    name: tika
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: tika-interceptorroute