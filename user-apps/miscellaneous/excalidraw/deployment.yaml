apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
  labels:
    app: excalidraw
  annotations:
    argocd.argoproj.io/ignore-differences: |-
      jsonPointers:
      - /spec/replicas
spec:
  replicas: 0
  selector:
    matchLabels:
      app: excalidraw
  template:
    metadata:
      labels:
        app: excalidraw
        netpol.cilium.io/egress-deny: "true"
        netpol.cilium.io/ingress-from-keda-http: "true"
    spec:
      containers:
        - name: excalidraw
          image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false