apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: sockpuppet-interceptorroute
spec:
  target:
    service: sockpuppet
    port: 3000
  rules:
    - hosts:
        - "sockpuppet-proxy.changedetection.svc.cluster.local"
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sockpuppet-scaledobject
spec:
  scaleTargetRef:
    name: sockpuppet
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 120
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: sockpuppet-interceptorroute