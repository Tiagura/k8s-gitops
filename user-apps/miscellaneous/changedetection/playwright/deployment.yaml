apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockpuppet
  labels:
    app: sockpuppet
  annotations:
    argocd.argoproj.io/ignore-differences: |-
      jsonPointers:
      - /spec/replicas
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sockpuppet
  template:
    metadata:
      labels:
        app: sockpuppet
        netpol.cilium.io/egress-to-kube-dns: "true"
        netpol.cilium.io/egress-to-public-ips: "true"
        netpol.cilium.io/ingress-from-keda-http: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sockpuppet
          image: dgtlmoon/sockpuppetbrowser:0.0.5
          ports:
            - containerPort: 3000
          env:
            - name: SCREEN_WIDTH
              value: "1920"
            - name: SCREEN_HEIGHT
              value: "1024"
            - name: SCREEN_DEPTH
              value: "16"
            - name: MAX_CONCURRENT_CHROME_PROCESSES
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              add:
                - SYS_ADMIN
          livenessProbe:
            exec:
              command:
                - python3
                - /usr/src/app/docker-health-check.py
                - --host
                - http://localhost
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python3
                - /usr/src/app/docker-health-check.py
                - --host
                - http://localhost
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3