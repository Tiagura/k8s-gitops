apiVersion: v1
kind: Service
metadata:
  name: sockpuppet
spec:
  selector:
    app: sockpuppet
  ports:
    - name: puppeteer
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppet-proxy
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - port: 8080