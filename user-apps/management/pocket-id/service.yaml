apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  labels:
    app: pocket-id
spec:
  type: ClusterIP
  selector:
    app: pocket-id
  ports:
    - name: http
      protocol: TCP
      port: 1411
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id-metrics
  labels:
    app: pocket-id
spec:
  type: ClusterIP
  selector:
    app: pocket-id
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP