# Adapted from: https://longhorn.io/docs/archives/1.6.1/monitoring/integrating-with-rancher-monitoring/
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn-svc-metrics
  labels:
    app.kubernetes.io/name: longhorn
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  namespaceSelector:
    matchNames:
    - longhorn
  endpoints:
  - port: manager
    path: /metrics