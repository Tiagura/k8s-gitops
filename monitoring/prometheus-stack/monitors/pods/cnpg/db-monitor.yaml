apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-pg-db-metrics
  name: cnpg-db-metrics-monitor
spec:
  namespaceSelector:
    matchNames:
      - cloudnative-pg
  podMetricsEndpoints:
  - port: metrics
  selector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists