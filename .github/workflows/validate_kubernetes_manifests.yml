name: Validate Kubernetes Manifests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Compute checkout depth
        id: depth
        run: |
          echo "depth=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: ${{ steps.depth.outputs.depth }}
          fetch-tags: false
          filter: blob:none

      - name: Check for changes
        id: check-changes
        uses: ./.github/actions/changed-paths
        with:
          paths: infrastructure/ monitoring/ user-apps/
          checkout-depth: ${{ steps.depth.outputs.depth }}

      - name: Setup kubectl
        if: steps.check-changes.outputs.changed == 'true'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Setup Helm
        if: steps.check-changes.outputs.changed == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Render changed Kustomize manifests
        if: steps.check-changes.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            git diff --name-only \
              "$BASE_REF" \
              "$HEAD_REF" \
              -- infrastructure monitoring user-apps
          )

          mapfile -t dirs < <(
            for file in "${changed_files[@]}"; do
              dir=$(dirname "$file")

              # Walk up from each changed file until the nearest kustomization
              # directory is found. This keeps rendering scoped to altered dirs.
              while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                if [ -f "$dir/kustomization.yaml" ] || [ -f "$dir/kustomization.yml" ]; then
                  printf '%s\\n' "$dir"
                  break
                fi
                dir=$(dirname "$dir")
              done
            done | sort -u
          )

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No altered Kustomize directories found."
            exit 1
          fi

          : > /tmp/all-manifests.yaml

          for dir in "${dirs[@]}"; do
            echo "Rendering ${dir}"
            kubectl kustomize --enable-helm "${dir}" >> /tmp/all-manifests.yaml
            echo "---" >> /tmp/all-manifests.yaml
          done

          if [ ! -s /tmp/all-manifests.yaml ]; then
            echo "ERROR: No manifests rendered"
            exit 1
          fi

      - name: Install kubeconform
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          KUBECONFORM_VERSION="0.7.0"

          echo "Installing kubeconform version: ${KUBECONFORM_VERSION}"

          URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          curl -sSL -o /tmp/kubeconform.tar.gz "$URL"

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

          echo "Installed version:"
          kubeconform -v

      - name: Validate Kubernetes manifests
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          kubeconform \
            -summary \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json \
            /tmp/all-manifests.yaml